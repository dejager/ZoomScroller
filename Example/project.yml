name: ZoomScrollerDemo
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  ZoomScroller:
    path: ..
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
targets:
  ZoomScrollerDemo:
    type: application
    platform: iOS
    sources:
      - path: ZoomScrollerDemo
        excludes: [Media, Fonts]
      - path: ZoomScrollerDemo/Media
        type: folder
        buildPhase: resources
    info:
      path: ZoomScrollerDemo/Info.plist
      properties:
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        CFBundleDisplayName: ZoomScrollerDemo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: ZoomScroller
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.zoomscroller.demo
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
  ZoomScrollerDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ZoomScrollerDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.zoomscroller.demo.uitests
schemes:
  ZoomScrollerDemo:
    build:
      targets:
        ZoomScrollerDemo: all
    test:
      targets: [ZoomScrollerDemoUITests]
